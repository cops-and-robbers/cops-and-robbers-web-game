name: "📝 문서"
description: 문서와 스킬을 쓰거나 고쳐요.
labels: ["documentation"]
body:
  - type: textarea
    id: content
    attributes:
      label: 📝 내용
      description: 무엇을 쓰거나 고칠지 적어주세요.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 📍 위치
      placeholder: 예) docs/cost-guard.md
    validations:
      required: false
