name: "🎨 UI · 디자인"
description: 화면, 캐릭터, 문구를 다듬어요.
labels: ["design"]
body:
  - type: textarea
    id: current
    attributes:
      label: 🎯 지금 화면 · 아쉬운 점
      description: 어디가 어떻게 어색한지 적어주세요. 스크린샷이 있으면 함께요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: ✨ 제안하는 개선
    validations:
      required: true
  - type: checkboxes
    id: considerations
    attributes:
      label: 고려 사항
      options:
        - label: 폰 터치 조작 확인이 필요해요
        - label: 작은 폰에서 확인이 필요해요
        - label: 사용자 문구 변경이 포함돼요
        - label: 경찰과 도둑을 대등하게 다뤄요
    validations:
      required: false
