# 계정 번호와 비밀값은 여기에 적지 않는다. 공개 저장소다.
name = "cops-and-robbers-web-game"
main = "server/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[vars]
WAIT_SEC = "15"
GAME_SEC = "180"
ALLOWED_ORIGINS = ""
